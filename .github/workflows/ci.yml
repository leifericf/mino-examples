name: ci

# Build every embedding example (C and C++) against the pinned mino
# submodule and run the use-case examples. mino is bootstrapped from the
# submodule (`make` produces ./mino/mino); the build then goes through
# the mino task runner (`./mino/mino task build`), which compiles each
# example against mino's single-file amalgamation (dist/mino.{c,h,hpp}).
# A mino C-tree reorg is a no-op for this build once the pin is bumped.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap mino (from submodule)
        working-directory: mino
        run: make

      - name: Build all examples against the amalgamation
        run: ./mino/mino task build

      - name: Run the use-case examples
        run: ./mino/mino task test-use-cases
